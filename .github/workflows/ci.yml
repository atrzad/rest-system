name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rest_system
          POSTGRES_PASSWORD: rest_system
          POSTGRES_DB: rest_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rest_system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Rodar migrações
        env:
          DATABASE_URL: postgresql+asyncpg://rest_system:rest_system@localhost:5432/rest_system_test
        run: .venv/bin/alembic upgrade head

      - name: Rodar testes
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://rest_system:rest_system@localhost:5432/rest_system_test
          REDIS_URL: redis://localhost:6379/0
        run: .venv/bin/pytest -v

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck + build
        run: npm run build
