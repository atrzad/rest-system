name: rest-system-tailscale
# "Máquina" própria na rede Tailscale só para o Rest System: https://rest-system.<sua-tailnet>.ts.net
# Não mexe no tailscaled da máquina nem no Funnel dos outros projetos (modo userspace, estado próprio).
# Primeiro login: sem chave. Rode `docker compose up -d` e abra o link de login que aparece em
# `docker logs rest-system-tailscale`. Depois disso o estado fica em ./estado.
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: rest-system-tailscale
    hostname: rest-system
    network_mode: host          # enxerga o app em 127.0.0.1:3700
    environment:
      - TS_HOSTNAME=rest-system
      - TS_AUTH_ONCE=true
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./estado:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped
